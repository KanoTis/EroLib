services:
  app:
    image: ghcr.io/kanotis/erolib:latest
    init: true
    # 本地改源码构建时改用：
    # build: .
    # image: erolib:local
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      HOST: "0.0.0.0"
      AUTH_USERNAME: admin
      # Leave empty to disable auth (do not expose publicly)
      AUTH_PASSWORD: ""
      CREDENTIALS_SECRET: change-me-to-a-long-random-string
      DATA_DIR: /data
      MEDIA_DIR: /media
      CACHE_DIR: /cache
      SYNC_INTERVAL_HOURS: "4"
      MAX_DOWNLOAD_CONCURRENCY: "2"
      WEB_DIST_DIR: /app/apps/web/dist
      # Go/pion live-record (built into image)
      LIVE_RECORDER_BIN: /usr/local/bin/live-record
    volumes:
      - ./data:/data
      - ./media:/media
      - ./cache:/cache
    restart: unless-stopped
